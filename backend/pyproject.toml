[project]
name = "jai-auth-access-service"
version = "0.1.0"
description = "JAI Information System API — auth & access-management build"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ldap3>=2.9.0",
    "slowapi>=0.1.9",
    "filetype>=1.2.0",
    "requests>=2.33.1",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-anyio>=0.0.0",
    "anyio[trio]>=4.0.0",
]
mssql = [
    "pyodbc>=5.1.0",
]

[tool.uv]
index-url = "http://aitfs.jac.mil.ae:9081/repository/esnaad-pypy/simple/"
